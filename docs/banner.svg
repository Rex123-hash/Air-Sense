<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="AirSense — forecasting the pollution peak before it arrives">
  <title>AirSense — Forecasting the pollution peak before it arrives</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6faf7"/>
      <stop offset="1" stop-color="#eaf4ee"/>
    </linearGradient>
    <linearGradient id="leaf" x1="18" y1="52" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset=".55" stop-color="#1e9e4a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="spark" x1="560" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15803d" stop-opacity=".25"/>
      <stop offset="1" stop-color="#15803d" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <rect width="880" height="220" rx="20" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="878.5" height="218.5" rx="19.25" fill="none" stroke="#d7e7dd" stroke-width="1.5"/>

  <!-- logo mark -->
  <g transform="translate(56 62) scale(1.5)">
    <path fill="url(#leaf)"
          d="M57.2 5.6c.6-.3 1.2.2 1.1.9-2.4 24.2-18.2 41.6-40.6 41.6-1.9 0-3.4-.2-4.6-.6-.8-.3-1.3-1-1.3-1.9C11.8 25 30.2 8.4 57.2 5.6z"/>
    <path fill="none" stroke="#0f5c2e" stroke-width="2.6" stroke-linecap="round" opacity=".55"
          d="M13.6 47.8C22.4 34.6 36.4 20.8 55.4 9.4"/>
    <g fill="none" stroke="#0f5c2e" stroke-width="1.9" stroke-linecap="round" opacity=".34">
      <path d="M20.6 40.2c3.6-3.4 8.2-4.6 13.4-4.2"/>
      <path d="M29.4 30.6c3.2-3.8 7.6-5.6 12.8-5.8"/>
      <path d="M38.8 22.2c2.4-3.6 5.6-6 9.6-7.2"/>
    </g>
    <g fill="none" stroke="#4ade80" stroke-width="3.4" stroke-linecap="round">
      <path d="M4.6 53.4c5.4-2.6 11.4-3 17.8-1.2"/>
      <path d="M15.2 60.2c4.6-2.2 9.6-2.6 15-1.2"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="176" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="800" letter-spacing="-1.6" fill="#14532d">AirSense</text>
  <text x="179" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="500" fill="#4b5563">Forecasting the pollution peak before it arrives.</text>

  <!-- validated-result chip -->
  <g transform="translate(179 158)">
    <rect width="252" height="32" rx="16" fill="#15803d" fill-opacity=".1"/>
    <circle cx="18" cy="16" r="4.5" fill="#15803d"/>
    <text x="32" y="21" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="13.5" font-weight="600" fill="#15803d">25.8% better than baseline · R² 0.801</text>
  </g>

  <!-- forecast sparkline: solid measured, dashed prediction -->
  <g transform="translate(0 -6)">
    <path d="M566 150c14-6 22 4 34-10s20-26 32-22 18 26 30 22 20-30 32-34"
          fill="none" stroke="url(#spark)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M694 106c14-4 22 10 34 4s22-26 34-30"
          fill="none" stroke="#15803d" stroke-width="3.2" stroke-dasharray="8 6"
          stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    <circle cx="694" cy="106" r="5" fill="#15803d"/>
    <circle cx="762" cy="80" r="5" fill="#f97316"/>
    <text x="742" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="12.5" font-weight="700" fill="#ea580c">peak</text>
  </g>
</svg>
